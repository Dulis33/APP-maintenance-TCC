<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Test fichiers appli</title></head>
<body style="font-family:Arial;padding:20px">
<h1>Test des fichiers</h1>
<ul id="list"></ul>
<script>
const files = ['style.css','icons/icon-192.png','js/00-init.js','js/01-config.js','js/02-storage.js','js/03-helpers.js','js/04-models-data.js','js/05-counters-states.js','js/06-tables.js','js/07-energy.js','js/08-intervention.js','js/09-admin.js','js/10-views-main.js','js/11-views-tcc.js','js/12-views-injecteurs.js','js/13-render.js'];
const list = document.getElementById('list');
(async()=>{
 for (const f of files) {
   const li=document.createElement('li');
   try{ const r=await fetch(f,{cache:'no-store'}); li.textContent=(r.ok?'✅ ':'❌ ')+f+' — '+r.status; }
   catch(e){ li.textContent='❌ '+f+' — '+e.message; }
   list.appendChild(li);
 }
})();
</script>
</body>
</html>
