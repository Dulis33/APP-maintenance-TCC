<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nettoyage cache PWA</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f8fafc;color:#0f172a;padding:24px;line-height:1.5}
    button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#2563eb;color:white;font-size:16px}
    .box{max-width:760px;margin:auto;background:white;border:1px solid #e2e8f0;border-radius:18px;padding:20px;box-shadow:0 12px 30px rgba(15,23,42,.08)}
    code{background:#e2e8f0;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Nettoyage cache PWA</h1>
    <p>Ce bouton supprime seulement les caches PWA et désactive les anciens service workers. Il ne supprime pas les données localStorage de l'application.</p>
    <button id="cleanBtn">Nettoyer puis ouvrir l'application</button>
    <p id="result"></p>
  </div>
  <script>
    document.getElementById('cleanBtn').onclick = async function(){
      const out = document.getElementById('result');
      out.textContent = 'Nettoyage en cours...';
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.unregister()));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        out.textContent = 'Nettoyage terminé. Ouverture...';
        setTimeout(() => { location.href = 'index.html'; }, 500);
      } catch(e) {
        out.textContent = 'Erreur nettoyage : ' + e.message;
      }
    };
  </script>
</body>
</html>
